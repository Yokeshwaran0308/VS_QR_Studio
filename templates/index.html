<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VS QR STUDIO - QR Code Generator</title>

    <meta name="description"
    content="VS QR STUDIO - Create, customize and download standard and branded QR codes online.">

    <meta name="google-site-verification"
    content="eLYV33tAO-h63axAmABcPuawvWRsTT3jvgqC3zOGZ-U">

    <meta property="og:site_name" content="VS QR STUDIO">
    <meta property="og:title" content="VS QR STUDIO - QR Code Generator">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VS QR STUDIO",
      "alternateName": "VS QR",
      "url": "https://vs-qr-studio.onrender.com/"
    }
    </script>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>VS QR STUDIO</h1>
    <p>Create your own QR Code</p>

    <input id="text" placeholder="Enter text or URL">

    <select id="mode">
        <option value="standard">Standard QR</option>
        <option value="brand">Branded QR</option>
    </select>

    <input type="file" id="logo" accept="image/*">

    <label>QR Colour</label>
    <input type="color" id="dark" value="#000000">

    <label>Background Colour</label>
    <input type="color" id="light" value="#ffffff">

    <select id="size">
        <option value="300">300 × 300</option>
        <option value="500">500 × 500</option>
        <option value="800">800 × 800</option>
    </select>

    <button onclick="generateQR()">Generate QR</button>

    <div id="result"></div>

    <script src="/static/script.js"></script>

</body>
</html>
